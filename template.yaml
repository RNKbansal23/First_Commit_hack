AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FirstMover Job Scraper and Evaluator

Resources:
  JobsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: FirstMover-Jobs
      PrimaryKey:
        Name: JobID
        Type: String

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/scraper_lambda/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 60

  FirstMoverStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: backend/statemachine/firstmover.asl.json
      DefinitionSubstitutions:
        JobsTableName: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"

  HourlyScrapeSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "rate(1 hour)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScraperFunction.Arn
          Id: ScraperTarget