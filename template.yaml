AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FirstMover Job Scraper and Evaluator

Resources:
  # 1. The DynamoDB Table
  JobsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: FirstMover-Jobs
      PrimaryKey:
        Name: JobID
        Type: String

  # 2. The Scraper Lambda Function
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/scraper_lambda/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 60

  # 3. The Step Function (The AI Brain)
  FirstMoverStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: backend/statemachine/firstmover.asl.json
      DefinitionSubstitutions:
        JobsTableName: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            # Grant permission to call Amazon Bedrock
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

  # 4. The EventBridge Trigger (Runs every hour)
  HourlyScrapeSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "rate(1 hour)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScraperFunction.Arn
          Id: ScraperTarget