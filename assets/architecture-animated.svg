<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      
      text {
        font-family: 'Inter', sans-serif;
        fill: #FFFFFF;
      }
      
      .box {
        fill: #1A1C29;
        stroke: #2E3246;
        stroke-width: 2;
        rx: 12;
      }

      .box-highlight {
        fill: #1E293B;
        stroke: #3B82F6;
        stroke-width: 2;
        rx: 12;
      }
      
      .box-aws {
        stroke: #F59E0B;
      }

      .box-db {
        stroke: #10B981;
      }
      
      .box-telegram {
        stroke: #0EA5E9;
      }

      .line {
        fill: none;
        stroke: #64748B;
        stroke-width: 2.5;
        stroke-dasharray: 6;
        animation: dash 3s linear infinite;
      }
      
      .line-fast {
        fill: none;
        stroke: #3B82F6;
        stroke-width: 3;
        stroke-dasharray: 8;
        animation: dash 1.5s linear infinite;
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -24;
        }
      }
      
      .title {
        font-size: 28px;
        font-weight: 800;
        fill: #F8FAFC;
        letter-spacing: 1px;
      }
      
      .subtitle {
        font-size: 14px;
        font-weight: 400;
        fill: #94A3B8;
      }
      
      .node-title {
        font-size: 16px;
        font-weight: 600;
      }
      
      .node-desc {
        font-size: 12px;
        fill: #94A3B8;
      }
      
      .badge {
        font-size: 10px;
        font-weight: 800;
        fill: #FFFFFF;
      }
    </style>
    
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <marker id="arrow-fast" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#0F111A" />
  
  <!-- Header -->
  <text x="500" y="60" text-anchor="middle" class="title">JOBPULSE SERVERLESS ARCHITECTURE</text>
  <text x="500" y="85" text-anchor="middle" class="subtitle">Live Scraping, MatchEngine, and Telegram Dispatch</text>

  <!-- Left Side: Triggers & UI -->
  <!-- EventBridge -->
  <g transform="translate(50, 150)">
    <rect width="200" height="70" class="box box-aws" />
    <text x="100" y="30" text-anchor="middle" class="node-title">EventBridge</text>
    <text x="100" y="50" text-anchor="middle" class="node-desc">Hourly Cron Trigger</text>
    <!-- Badge -->
    <rect x="75" y="-10" width="50" height="20" rx="10" fill="#F59E0B" />
    <text x="100" y="4" text-anchor="middle" class="badge">AWS</text>
  </g>

  <!-- Vercel Frontend -->
  <g transform="translate(50, 450)">
    <rect width="200" height="70" class="box" />
    <text x="100" y="30" text-anchor="middle" class="node-title">Vercel React App</text>
    <text x="100" y="50" text-anchor="middle" class="node-desc">Live Job Feed UI</text>
  </g>

  <!-- User Input -->
  <g transform="translate(50, 560)">
    <rect width="200" height="70" class="box box-telegram" />
    <text x="100" y="30" text-anchor="middle" class="node-title">Telegram User</text>
    <text x="100" y="50" text-anchor="middle" class="node-desc">Set Filters (/start)</text>
    <!-- Badge -->
    <rect x="75" y="-10" width="50" height="20" rx="10" fill="#0EA5E9" />
    <text x="100" y="4" text-anchor="middle" class="badge">BOT</text>
  </g>


  <!-- Middle: Processing -->
  <!-- Scraper Lambda -->
  <g transform="translate(380, 150)">
    <rect width="240" height="90" class="box-highlight box-aws" />
    <text x="120" y="35" text-anchor="middle" class="node-title">Scraper Lambda</text>
    <text x="120" y="55" text-anchor="middle" class="node-desc">Python (urllib)</text>
    <text x="120" y="75" text-anchor="middle" class="node-desc">Parses Lever/Greenhouse</text>
  </g>

  <!-- MatchEngine Lambda -->
  <g transform="translate(380, 430)">
    <rect width="240" height="90" class="box-highlight box-aws" />
    <text x="120" y="35" text-anchor="middle" class="node-title">MatchEngine Lambda</text>
    <text x="120" y="55" text-anchor="middle" class="node-desc">Event-Driven Processor</text>
    <text x="120" y="75" text-anchor="middle" class="node-desc">Evaluates User WatchRules</text>
    <!-- Badge -->
    <rect x="95" y="-10" width="50" height="20" rx="10" fill="#F59E0B" />
    <text x="120" y="4" text-anchor="middle" class="badge">CORE</text>
  </g>


  <!-- Right Side: Database & Notifications -->
  <g transform="translate(720, 250)">
    <rect width="240" height="200" class="box box-db" />
    <text x="120" y="35" text-anchor="middle" class="node-title">Amazon DynamoDB</text>
    <text x="120" y="55" text-anchor="middle" class="node-desc">NoSQL Serverless DB</text>
    
    <!-- Table 1 -->
    <rect x="20" y="80" width="200" height="40" rx="6" fill="#064E3B" stroke="#10B981" />
    <text x="120" y="105" text-anchor="middle" class="node-title" style="font-size: 13px;">FirstMover-Jobs</text>
    
    <!-- Table 2 -->
    <rect x="20" y="135" width="200" height="40" rx="6" fill="#064E3B" stroke="#10B981" />
    <text x="120" y="160" text-anchor="middle" class="node-title" style="font-size: 13px;">FirstMover-WatchRules</text>
  </g>
  
  <!-- SNS -->
  <g transform="translate(740, 520)">
    <rect width="200" height="70" class="box box-aws" />
    <text x="100" y="30" text-anchor="middle" class="node-title">Amazon SNS</text>
    <text x="100" y="50" text-anchor="middle" class="node-desc">HTTPS Webhook Push</text>
  </g>

  <!-- Final Output: Phone -->
  <g transform="translate(740, 620)">
    <rect width="200" height="50" class="box box-telegram" />
    <text x="100" y="30" text-anchor="middle" class="node-title">Telegram Alert 📱</text>
  </g>

  <!-- Connectors / Lines -->
  <!-- EventBridge to Scraper -->
  <path d="M 250 185 L 380 185" class="line" marker-end="url(#arrow)" />
  
  <!-- Scraper to DynamoDB Jobs -->
  <path d="M 620 195 C 670 195, 680 300, 720 300" class="line" marker-end="url(#arrow)" />
  
  <!-- Vercel to DynamoDB Jobs -->
  <path d="M 250 485 C 300 485, 330 310, 720 310" class="line" stroke-dasharray="4" stroke="#475569" marker-end="url(#arrow)" />
  
  <!-- User to DynamoDB Rules -->
  <path d="M 250 595 C 320 595, 330 400, 720 400" class="line" marker-end="url(#arrow)" />

  <!-- DynamoDB to MatchEngine (Stream trigger) -->
  <path d="M 720 380 C 670 380, 680 475, 620 475" class="line-fast" marker-end="url(#arrow-fast)" />
  
  <!-- MatchEngine to SNS -->
  <path d="M 620 500 C 680 500, 680 555, 740 555" class="line-fast" marker-end="url(#arrow-fast)" />
  
  <!-- SNS to Telegram -->
  <path d="M 840 590 L 840 620" class="line-fast" marker-end="url(#arrow-fast)" />

</svg>
